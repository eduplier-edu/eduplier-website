<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduplier | Request Free Counselling</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.eduplier.com/index.html#contact">

    <!-- Redirect for browsers -->
    <meta http-equiv="refresh" content="0; url=/index.html#contact">

    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">

    <style>
        .redirect-wrap {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .redirect-wrap p {
            color: var(--text);
            margin-top: 10px;
        }
        .redirect-wrap a {
            color: var(--blue);
            font-weight: 700;
        }
    </style>

    <script>
        window.location.replace("/index.html#contact");
    </script>
</head>
<body>

    <div class="redirect-wrap">
        <div>
            <h1 style="font-family:'Plus Jakarta Sans', sans-serif; color: var(--dark); font-size: 26px; margin-bottom: 10px;">
                Taking you to Eduplier...
            </h1>
            <p>
                If you are not redirected automatically,
                <a href="/index.html#contact">click here to request free counselling</a>.
            </p>
        </div>
    </div>

</body>
</html>
