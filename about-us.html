<style>
  /* ---------- Tokens ---------- */
  :root {
    --ink: #0D2B45;
    --ink-soft: #3D566E;
    --paper: #F6F8FB;
    --white: #FFFFFF;
    --marigold: #FFB400;
    --marigold-deep: #E39A00;
    --sky: #2E7DF6;
    --mint: #DDF3EA;
    --line: #D9E1EA;
    --radius: 18px;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.65;
    color: var(--ink-soft);
    background: var(--paper);
    padding-bottom: 64px;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  h1, h2, h3, h4 { font-family: var(--font-display); color: var(--ink); line-height: 1.1; margin: 0; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }

  .wrap { width: min(1160px, 100% - 2.5rem); margin-inline: auto; }
  section { padding: clamp(4rem, 8vw, 7rem) 0; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .95rem 1.6rem; border-radius: 999px;
    font-weight: 600; font-size: 1rem; text-decoration: none;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn-primary { background: var(--marigold); color: var(--ink); }
  .btn-primary:hover { background: var(--marigold-deep); transform: translateY(-2px); }
  .btn-ghost { border-color: var(--ink); color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--white); }
  .btn-light { border-color: rgba(255,255,255,.5); color: var(--white); }
  .btn-light:hover { background: var(--white); color: var(--ink); }

  /* ---------- Top strip + header ---------- */
  .strip { background: var(--ink); color: rgba(255,255,255,.9); font-size: .86rem; }
  .strip .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-block: .5rem; flex-wrap: wrap; }
  .strip a { text-decoration: none; }
  .strip a:hover { color: var(--marigold); }
  @media (max-width: 700px) { .strip .strip-right { display: none; } .strip .wrap { justify-content: center; } }

  .topbar { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 76px; gap: 1rem; }
  .brand { text-decoration: none; display: flex; align-items: center; gap: .7rem; flex: none; }
  .brand-logo { height: 48px; width: auto; display: block; }
  .brand-text { display: flex; flex-direction: column; line-height: 1; }
  .brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.01em; color: var(--ink); }
  .brand-tag { font-size: .68rem; color: var(--ink-soft); margin-top: .3rem; }
