/* ===== BRAND COLORS: change these to match index.html ===== */
:root{--primary:#1e3a8a;--primary-dark:#142a66;--accent:#f59e0b;--accent-dark:#d97706;--bg:#f5f7fb;--card:#fff;--ink:#1b2437;--mute:#5f6b85;--line:#e3e8f2}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:auto;padding:0 20px}

.topbar{background:var(--primary-dark);color:#dbe3f7;font-size:.8rem}
.topbar .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.bar{display:flex;align-items:center;gap:20px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;color:var(--primary);font-weight:700;font-size:1.25rem;line-height:1.1}
.brand img{height:40px;width:auto}
.brand small{display:block;font-size:.66rem;font-weight:500;color:var(--mute)}
nav{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:.9rem;font-weight:500;color:var(--mute)}
nav a:hover,nav a.on{color:var(--primary)}
.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;padding:9px 18px;border-radius:999px}
.btn:hover{background:var(--accent-dark)}
nav .btn{color:#fff}
.menu{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;font-size:1.3rem;padding:4px 12px;cursor:pointer;color:var(--primary)}
